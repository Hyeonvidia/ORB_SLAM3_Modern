# Usage:
#   docker compose build
#   docker compose run --rm dev docker/scripts/container_build.sh   # build
#   docker compose run --rm dev docker/scripts/run_slam.sh euroc_stereo MH01
# GUI: use ./run.sh. Default shows the viewer in a nested X server (Xephyr)
# window on the host XQuartz, with the SLAM GUI rendered into it via llvmpipe;
# XQuartz's own GLX is bypassed because it renders nothing for container
# clients (measured 2026-09-13). ./run.sh --vnc is the Screen Sharing
# alternative. Never set LIBGL_ALWAYS_INDIRECT either way.
services:
  dev:
    build:
      context: docker
      additional_contexts:
        pangolinsrc: third_party/Pangolin
        eigensrc: third_party/eigen
    image: orbslam3-modern-dev:latest
    platform: linux/arm64
    shm_size: 2gb
    working_dir: /workspace
    environment:
      - DISPLAY=host.docker.internal:0
      - XDG_RUNTIME_DIR=/tmp
      - CCACHE_DIR=/ccache
    volumes:
      - .:/workspace
      - ../Datasets:/datasets:ro
      - ./results:/results
      - orbmodern-build:/build
      - orbmodern-ccache:/ccache
    command: sleep infinity

  # P10-0: TSAN runs only. ThreadSanitizer disables ASLR via the
  # personality(2) syscall, which Docker's default seccomp profile blocks
  # (FATAL CHECK in tsan_platform_linux.cpp:296). Diagnostic-only service --
  # never used for gate/ATE-judged runs.
  dev-tsan:
    extends: dev
    security_opt:
      - seccomp=unconfined

volumes:
  orbmodern-build:
  orbmodern-ccache:
